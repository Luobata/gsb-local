# GSB watchdog error patterns
#
# Each non-comment line is a JavaScript regular expression (case-insensitive),
# matched against the bottom lines of a spoke pane's viewport. Keep patterns
# conservative: a match must persist across consecutive polls while the screen
# is idle before the watchdog acts, but high-signal patterns still matter.
# Lines that fail to compile are skipped with a warning in watchdog.log.
#
# GSB wake-up drafts are detected structurally by bin/wake-detect.mjs, not as
# error text here; keeping the prefix out of this table prevents soft recovery
# from competing with the draft-only Enter fallback.

API Error
api_error
\b429\b
rate.?limit
overloaded
stream (error|stalled|interrupted)
ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENOTFOUND
fetch failed
